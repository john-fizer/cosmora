version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports: ["5432:5432"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/cosmospassword
    ports: ["7474:7474", "7687:7687"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
